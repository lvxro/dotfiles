<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  /* Bento grid on solid night navy: the new tab is its own place, not a window onto the wallpaper.
     Same palette and fonts as the bar and the terminal. */
  :root {
    --bg: #0A0F1C;
    --tile: #111829;
    --tile-2: #161F36;
    --line: #232D4B;
    --text: #DFE6FB;
    --haze: #A3B4E0;
    --dim: #5A6A99;
    --ribbon: #6FA4FF;
    --violet: #9B82FF;
    --amber: #F0C48A;
    --rose: #F07A8F;
    --ui: "Rounded Mplus 1c", "M PLUS Rounded 1c", "Zen Kaku Gothic New", "Yu Gothic UI", "Segoe UI", sans-serif;
    --mono: "M+1Code Nerd Font", "JetBrainsMono Nerd Font", "Cascadia Mono", Consolas, monospace;
    --r: 22px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--ui);
    display: grid; place-items: center; overflow: hidden;
    /* a faint dot grid and two soft glows in the corners, so the solid navy is not flat */
    background-image:
      radial-gradient(900px 600px at 0% 0%, rgba(111, 164, 255, .10), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(155, 130, 255, .10), transparent 60%),
      radial-gradient(rgba(163, 180, 224, .10) 1px, transparent 1.2px);
    background-size: auto, auto, 22px 22px;
  }

  .bento {
    width: min(1240px, 92vw);
    display: grid; gap: 14px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 168px 214px 250px;
    grid-template-areas:
      "clock  clock  search search"
      "clock  clock  wx     cal"
      "art    links  links  air";
  }
  .tile {
    position: relative; min-width: 0; overflow: hidden;
    background: var(--tile); border: 1px solid var(--line); border-radius: var(--r);
    padding: 20px 22px;
    transition: border-color .2s;
  }
  .tile:hover { border-color: #33416E; }
  .label {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); display: flex; justify-content: space-between; align-items: center;
  }
  .label b { color: var(--violet); font-weight: 400; }

  /* ---- clock: the one loud tile */
  .clock { grid-area: clock; display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(160deg, #15203D 0%, var(--tile) 55%); }
  .clock .time { font-size: 148px; font-weight: 800; line-height: .9; letter-spacing: -2px;
    font-variant-numeric: tabular-nums; }
  .clock .time .sep { background: linear-gradient(180deg, var(--ribbon), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .clock .greet { font-size: 22px; font-weight: 700; }
  .clock .greet span { color: var(--ribbon); }
  .clock .date { margin-top: 6px; color: var(--haze); font-size: 15px; }
  .clock .jp { font-family: var(--mono); color: var(--dim); font-size: 13px; margin-top: 2px; }
  .clock .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--line); }
  .clock .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ribbon), var(--violet)); }

  /* ---- search: looks like a prompt */
  .search { grid-area: search; display: flex; flex-direction: column; justify-content: space-between; }
  .search form { display: flex; align-items: center; gap: 12px; font-family: var(--mono);
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; }
  .search form:focus-within { border-color: var(--ribbon); box-shadow: 0 0 0 4px rgba(111, 164, 255, .12); }
  .search .ps { color: var(--violet); font-size: 18px; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text);
    font: 17px var(--mono); padding: 15px 0; }
  .search input::placeholder { color: var(--dim); }
  .search kbd { font: 11px var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .search .hint { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .search .hint em { font-style: normal; color: var(--amber); }

  /* ---- weather */
  .wx { grid-area: wx; display: flex; flex-direction: column; justify-content: space-between; }
  .wx .now { display: flex; align-items: center; gap: 12px; }
  .wx .icon { font-size: 40px; line-height: 1; }
  .wx .temp { font-size: 54px; font-weight: 800; line-height: 1; }
  .wx .desc { color: var(--haze); font-size: 14px; }
  .wx .range { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .wx .range .lo { color: var(--ribbon); } .wx .range .hi { color: var(--amber); }

  /* ---- calendar */
  .cal { grid-area: cal; }
  .cal table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-top: 10px; font-family: var(--mono); font-size: 12px;
    font-variant-numeric: tabular-nums; }
  .cal th { color: var(--dim); font-weight: 400; padding-bottom: 4px; }
  .cal td { text-align: center; height: 25px; color: var(--haze); }
  .cal td.out { color: transparent; }
  .cal td.we { color: var(--dim); }
  .cal td.today span { display: inline-block; min-width: 22px; border-radius: 7px; background: var(--ribbon); color: #070A14; font-weight: 700; }

  /* ---- art: the fastfetch girl, drawn in light lines */
  .art { grid-area: art; padding: 0; background: var(--tile-2); }
  .art img { position: absolute; right: -6%; bottom: -10%; width: 112%; opacity: .9; }
  .art .label { position: absolute; top: 0; left: 0; right: 0; z-index: 1; padding: 18px 20px 28px;
    background: linear-gradient(var(--tile-2) 45%, transparent); }

  /* ---- links */
  .links { grid-area: links; display: flex; flex-direction: column; gap: 12px; }
  .links nav { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; }
  .links a { flex: 1 1 40%; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 14px;
    background: var(--bg); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px;
    transition: border-color .15s, background .15s, color .15s; }
  .links a:hover { border-color: var(--ribbon); background: #0E1730; color: var(--ribbon); }
  .links a img { width: 18px; height: 18px; border-radius: 4px; }

  /* ---- airing today, from AniList */
  .air { grid-area: air; display: flex; flex-direction: column; gap: 8px; }
  .air ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .air li a { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center;
    color: var(--text); text-decoration: none; padding: 3px; border-radius: 10px; }
  .air li a:hover { background: var(--tile-2); }
  .air li a:hover .t { color: var(--ribbon); }
  .air img { width: 34px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--line); }
  .air li a > div { min-width: 0; }
  .air .t { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .air .m { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .air .m b { color: var(--amber); font-weight: 400; }
  .air .m i { font-style: normal; color: var(--violet); }
  .air .empty { font-family: var(--mono); font-size: 12px; color: var(--dim); }

  @media (max-width: 900px) {
    body { overflow: auto; place-items: start center; padding: 24px 0; }
    .bento { grid-template-columns: 1fr 1fr; grid-template-rows: auto;
      grid-template-areas: "clock clock" "search search" "wx cal" "links links" "art air"; }
    .clock .time { font-size: 96px; }
    .tile { min-height: 170px; }
  }
  @media (prefers-reduced-motion: reduce) { .clock .time .sep { animation: none; } }
</style>
</head>
<body>
  <main class="bento">
    <section class="tile clock">
      <div class="label"><span>night balcony</span><b id="dayPct"></b></div>
      <div class="time" id="time">00<span class="sep">:</span>00</div>
      <div>
        <div class="greet" id="greet"></div>
        <div class="date" id="date"></div>
        <div class="jp" id="jp"></div>
      </div>
      <div class="bar"><i id="dayBar"></i></div>
    </section>

    <section class="tile search">
      <div class="label"><span>search</span><kbd>/</kbd></div>
      <form id="form" autocomplete="off">
        <span class="ps">❯</span>
        <input id="q" placeholder="google, or !yt !gh !al !w …" spellcheck="false">
      </form>
      <div class="hint"><em>!yt</em> youtube · <em>!gh</em> github · <em>!al</em> anilist · <em>!w</em> wikipedia</div>
    </section>

    <section class="tile wx" id="wx">
      <div class="label"><span>weather</span><b id="wxCity"></b></div>
      <div class="now"><span class="icon" id="wxIcon">·</span><span class="temp" id="wxTemp">--°</span></div>
      <div><div class="desc" id="wxDesc">loading…</div><div class="range" id="wxRange"></div></div>
    </section>

    <section class="tile cal">
      <div class="label"><span id="calMonth"></span><b id="calYear"></b></div>
      <table id="cal"></table>
    </section>

    <section class="tile art">
      <div class="label"><span>今夜 · tonight</span><b>✦</b></div>
      <img src="art.png" alt="">
    </section>

    <section class="tile links">
      <div class="label"><span>shortcuts</span><b id="linkCount"></b></div>
      <nav id="links"></nav>
    </section>

    <section class="tile air">
      <div class="label"><span id="airTitle">airing today</span><b>anilist</b></div>
      <ul id="air"><li class="empty">loading…</li></ul>
    </section>
  </main>

<script src="config.js"></script>
<script src="newtab.js"></script>
</body>
</html>
