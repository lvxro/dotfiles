# Night Balcony for Starship
# copy to %USERPROFILE%\.config\starship.toml
add_newline = true
scan_timeout = 100
palette = "night_balcony"

format = """
[╭─](fg:line) $directory$git_branch$git_status$python$nodejs$rust$cmd_duration
[╰─](fg:line)$character"""

[palettes.night_balcony]
line = "#5A6A99"     # dim haze
ribbon = "#6FA4FF"    # ribbon blue
glass = "#86D6C0"     # sea glass
haze = "#A3B4E0"     # sky haze
amber = "#F0C48A"
eyes = "#9B82FF"     # violet of her eyes
rose = "#F07A8F"     # errors

[directory]
style = "bold fg:ribbon"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:rose"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "fg:eyes"
format = "[on](fg:line) [$symbol$branch]($style) "

[git_status]
style = "fg:amber"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "fg:haze"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "fg:haze"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:haze"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "fg:line"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold fg:glass)"
error_symbol = "[❯](bold fg:rose)"
