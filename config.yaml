# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
system_colors: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    style: "bar"           # "adaptive" = top rail + islands per group
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
      hide_on_fullscreen: true   # se esconde en juegos / videos en pantalla completa
    dimensions:
      width: 100%
      height: 44        # no rail: each group is a floating island (see "Floating islands" in styles.css)
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      - desktops          # virtual desktops as dots; the active one is a longer pill
      - apps-island       # open apps + the focused window's name
      center:
      - clock-island      # weekday in kanji + clock
      right:
      - systeminfo-grouper  # CPU + RAM
      # Islands: a grouper's widgets must NOT also be listed here
      - music-island      # media + visualizador
      - system-island     # clima, tray, volumen, notificaciones, control center
widgets:
  apps-island:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "apps-island"
      hide_empty: true      # no open apps: the island disappears
      widgets: ["taskbar", "active_window"]
  clock-island:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "clock-island"
      widgets: ["clock_jp", "clock"]
  desktops:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: ""          # empty buttons, drawn as dots in styles.css
      label_workspace_active_btn: ""
  clock_jp:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a}'                   # 水 for Wednesday
      label_alt: '{%A}'
      locale: "ja_JP"
      class_name: "clock-jp"
      tooltip: false
      callbacks:
        on_left: do_nothing
        on_right: toggle_label
  music-island:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "music-island"
      hide_empty: true
      widgets: ["media", "audio_visualizer"]
  system-island:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "system-island"
      widgets: ["open_meteo", "systray", "volume", "notifications", "control_center"]
  alert-island:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "alert-island"
      widgets: ["notifications", "control_center"]
  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>{icon}</span>{temp}"
      label_alt: "{location} · {condition_text} · ↓{min_temp} ↑{max_temp}"
      tooltip: true
      update_interval: 1800   # every 30 min: Open-Meteo returned 503 with more frequent requests
      hide_decimal: true
      units: "metric"
      forecast_days: 7
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 8
        icon_size: 64
        show_hourly_forecast: true
        time_format: "24h"
        current_line_color: "#9B82FF"
        hourly_gradient:
          enabled: true
          top_color: "#6FA4FF"
          bottom_color: "#1A2338"
        hourly_forecast_buttons:
          enabled: true
          default_view: "temperature"
        weather_animation:
          enabled: true
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>家</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      - title: Wallpapers
        path: ~\Pictures\wallpapers
      system_menu: true
      power_menu: false
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a %d · %H:%M}<span>{alarm}</span>'
      label_alt: '{%A %d %B %Y · %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: true          # adds the upcoming holidays list
        show_years: true
        show_holidays: true
        country_code: "AR"
        holiday_color: "#F07A8F"
        show_week_numbers: true
      callbacks:
        on_left: do_nothing       # clock only, no calendar popup
        on_right: toggle_label
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: "<span>{icon}</span>"   # icon only; the % is in the tooltip
      label_alt: "<span>{icon}</span> {level}"
      tooltip: true
      icons:
        "muted": "\udb81\udd81" # md-volume_off
        "10": "\udb81\udd81"    # 0-10%
        "30": "\udb81\udd7f"    # 11-30%  md-volume_low
        "60": "\udb81\udd80"    # 31-60%  md-volume_medium
        "100": "\udb81\udd7e"   # 61-100% md-volume_high
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: true
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uf107"
          toggle_up: "\uf106"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\udb80\udc9e</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\udb80\udc09</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  taskbar:
    type: yasb.taskbar.TaskbarWidget
    options:
      icon_size: 16
      tooltip: true
      strict_filtering: true
      monitor_exclusive: false
      hide_empty: true
      grouping:
        enabled: true      # one icon per app
        show_count: false
      animation:
        enabled: true
        duration: 200
      title_label:
        enabled: false     # icons only; the app name is in the next pill
      preview:
        enabled: false
      callbacks:
        on_left: toggle_window
        on_middle: close_app
        on_right: context_menu
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[app_name]}'     # app name only
      label_alt: '{win[title]}'    # click: full title (cleaned by rewrite)
      label_no_window: ''
      label_icon: false   # the taskbar pill already shows the icon
      label_icon_size: 14
      max_length: 32
      max_length_ellipsis: '...'
      # Strips the app name from the end of the title. YASB ignores empty replacements,
      # so the rest is captured with (.*?) and replaced with \1.
      rewrite:
        - pattern: '^(.*?) [-–—] Google Chrome$'
          replacement: '\1'
        - pattern: '^(.*?)(?: [-–—] [^-–—]+)? [-–—] Microsoft.{0,2}Edge$'
          replacement: '\1'
        - pattern: '^(.*?) [-–—] Mozilla Firefox$'
          replacement: '\1'
        - pattern: '^(.*?) [-–—] Visual Studio Code$'
          replacement: '\1'
        - pattern: '^(.*?)(?: and \d+ more tabs?)? [-–—] File Explorer$'
          replacement: '\1'
        - pattern: '^(Steam) Client WebHelper$'   # Steam's UI process name
          replacement: '\1'
      monitor_exclusive: false
      ignore_window:
        processes: ["spotifast.exe"]   # what's playing is already shown in the music island
  win_button:
      type: "yasb.custom.CustomWidget"
      options:
        label: "家"
        label_alt: "家"
        class_name: "system-widget"
        callbacks:
          on_left: "exec start_menu"
  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: ""
      label_zero_index: false
      hide_empty_workspaces: true
      hide_if_offline: true
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf107"
      label_expanded: "\uf106"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: true
      show_volume: false
      use_hook: true
      icons_per_row: 3
      show_network: false
      hide_icons: [] # Optional, list of process names to hide (e.g. ["discord"])
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\udc8d</span>"
      change_automatically: false
    # Example path to folder with images. Can be a single string or a list of strings.
      image_path: "C:\\Users\\lvxro\\Pictures\\wallpapers"
      engine:
        enabled: true
        animation: "slide_top" # circle/slide_top/diamond/split
      gallery:
        image_width: 520
        image_corner_radius: 6
        type: "magnified" # default/magnified/strip/slide - see "Gallery types" below
        orientation: "landscape" # landscape/portrait
        accent_color: "auto"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "primary" # active/cursor/primary
  media:
    type: "yasb.media.MediaWidget"
    options:
      # artist and separator in dim haze, lighter weight; needs scrolling_label off (QLabel accepts HTML)
      label: "{title}<span style='color:#7A8BBD; font-weight:400'>{s}{artist}</span>"
      label_alt: "{artist}"
      separator: " · "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "toggle_label"
      max_field_size:
        label: 24                    # per field: title and artist are truncated separately
        label_alt: 40
        truncate_whole_label: false  # truncating the whole label would cut the <span> tags
      show_thumbnail: false   # title and artist only, no album art
      controls_only: false
      controls_left: true
      controls_hide: false
      thumbnail_alpha: 70
      thumbnail_padding: 8
      thumbnail_corner_radius: 14
      symmetric_corner_radius: true
      thumbnail_edge_fade: true
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 50
        show_source: true
        show_volume_slider: true
      media_menu_icons:
        play: "\uf04b"
        pause: "\uf04c"
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
      scrolling_label:
        enabled: false   # the scrolling label draws plain text and would show the raw HTML
        update_interval_ms: 33
        style: "bounce-ease"  # can be "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 0
        always_scroll: false
      # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      progress_bar:
        enabled: true        # Whether to enable the progress bar on the widget.
        alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".
  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "{lang[language_code]}"
      label_alt: "{lang[full_name]}"
      update_interval: 1
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      language_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icon: true
        layout_icon: "\udb80\udf0c"
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\uf002</span>"
      search_placeholder: "Search applications..."
      max_results: 30
      show_icons: true
      icon_size: 32
      popup:
        width: 650
        height: 400
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
          screen: "primary"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf437</span> {info[freq][current]} MHz"
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: true
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\udb80\udf5b</span> {virtual_mem_percent}%"
      label_alt: "<span>\uf4bc</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: true
  systeminfo-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "systeminfo-grouper"
      widgets: ["cpu", "memory"]
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\ueaf8</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        alignment: "right"
        direction: "down"
        border_color: none
        round_corners: false
        blur: true
        round_corners_type: normal
        offset_top: 8
        offset_left: -2
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Do Not Disturb"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mute"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Mic Mute"
              icon: "\uF12E"
            - id: "screenshot"
              label: "Screenshot"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Keyboard"
              icon: "\uE765"
            - id: "toggle_theme"
              label: "Dark Mode"
              icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: true
          power_plan_title: "Power Plan"
          power_mode_title: "Power Mode"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      style: bars
      height: 14
      smoothness: 80
      sensitivity: 50
      auto_gain: true
      framerate: 60
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 2000
      channels: stereo
      mono_option: average
      reverse: false
      mirror: true       # bars grow from the middle, so silence is a centered line
      bars:
        count: 12
        width: 1
        gap: 3
      waves:
        width: 48
      dots:
        count: 30
        size: 1
        gap: 2
